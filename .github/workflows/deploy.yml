# Builds, checks and deploys the service with the shared workflow of the
# organization: https://github.com/variamosple/.github
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: variamosple/.github/.github/workflows/deploy.yml@v1
    with:
      image: vms_requirements_autocomplete
      service: vmsrequirementsautocompleteaws
      health-url: https://app.variamos.com/vms_requirements_autocomplete/health
      health-name: vms_requirements_autocomplete
    secrets: inherit
